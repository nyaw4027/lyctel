<!-- Paste this into product_detail.html after the related products section -->

<div id="also-bought-section" class="mt-5" style="display:none">
  <h2 class="fw-bold text-navy mb-3" style="font-size:1.1rem">
    🛒 Customers Also Bought
  </h2>
  <div id="also-bought-grid"
       class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
  </div>
</div>

<script>
(function() {
  fetch('/orders/also-bought/{{ product.pk }}/')
    .then(r => r.json())
    .then(({ products }) => {
      if (!products || !products.length) return;
      const section = document.getElementById('also-bought-section');
      const grid    = document.getElementById('also-bought-grid');
      section.style.display = 'block';
      grid.innerHTML = products.map(p => `
        <div class="col">
          <a href="${p.url}" class="card border-0 shadow-sm rounded-3 text-decoration-none h-100"
             style="transition:.15s">
            <div style="height:140px;overflow:hidden;border-radius:12px 12px 0 0">
              ${p.image
                ? `<img src="${p.image}" alt="${p.name}"
                        style="width:100%;height:100%;object-fit:cover" loading="lazy"/>`
                : `<div style="width:100%;height:100%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:2rem">📦</div>`
              }
            </div>
            <div class="p-2">
              <p class="fw-semibold text-navy mb-1"
                 style="font-size:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
                ${p.name}
              </p>
              <p class="fw-bold mb-0 text-gold" style="font-size:.85rem">
                GHS ${p.price}
              </p>
              <p class="text-muted mb-0" style="font-size:.72rem">${p.vendor}</p>
            </div>
          </a>
        </div>
      `).join('');
    })
    .catch(() => {});
})();
</script>
